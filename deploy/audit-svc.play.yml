---
- name: Deploy audit-svc infrastructure
  hosts: localhost
  connection: local
  become: true
  vars:
    app_dir: "/data/audit-svc"
    app_image: "ghcr.io/konstantinstan/final-dz:{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  tasks:
    - name: Create docker network
      community.docker.docker_network:
        name: audit-net
        state: present

    - name: Ensure app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/nginx"

    - name: Run PostgreSQL container
      community.docker.docker_container:
        name: postgres
        image: postgres:16-alpine
        state: started
        restart_policy: always
        networks:
          - name: audit-net
        ports:
          - "127.0.0.1:5433:5432"
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
          POSTGRES_DB: "postgres"

    - name: Wait for PostgreSQL to be ready
      community.docker.docker_container_exec:
        container: postgres
        command: pg_isready -U postgres
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 25
      delay: 2

    - name: Create audit_svc user if not exists
      community.docker.docker_container_exec:
        container: postgres
        command: >
          sh -c "psql -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='audit_svc'\" | grep -q 1 || psql -U postgres -c \"CREATE USER audit_svc WITH PASSWORD '{{ vault_audit_svc_password }}';\""

    - name: Create audit_svc database if not exists
      community.docker.docker_container_exec:
        container: postgres
        command: >
          sh -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='audit_svc'\" | grep -q 1 || (psql -U postgres -c \"CREATE DATABASE audit_svc OWNER audit_svc;\" && psql -U postgres -c \"GRANT ALL PRIVILEGES ON DATABASE audit_svc TO audit_svc;\")"

    - name: Run database migrations
      community.docker.docker_container:
        name: audit-svc-migrate
        image: "{{ app_image }}"
        state: started
        detach: false
        cleanup: true
        networks:
          - name: audit-net
        env:
          DATABASE_URL: "postgresql://audit_svc:{{ vault_audit_svc_password }}@postgres:5432/audit_svc"
        command: "python -m audit_svc.migrate"

    - name: Render audit-svc config
      ansible.builtin.template:
        src: templates/config.yaml.j2
        dest: "{{ app_dir }}/config.yaml"
        mode: '0600'
      register: svc_config

    - name: Run audit-svc container
      community.docker.docker_container:
        name: audit-svc
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        networks:
          - name: audit-net
        volumes:
          - "{{ app_dir }}/config.yaml:/app/config.yaml:ro"
        env:
          CONFIG_PATH: "/app/config.yaml"

    - name: Reload audit-svc config if template changed
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/reload"
        method: POST
        status_code: 200
      when: svc_config.changed and not audit_svc_container.changed | default(false)
      ignore_errors: true

    - name: Render nginx config
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "{{ app_dir }}/nginx/nginx.conf"
        mode: '0644'
      register: nginx_config

    - name: Run Nginx container
      community.docker.docker_container:
        name: nginx
        image: nginx:alpine
        state: started
        restart_policy: always
        networks:
          - name: audit-net
        ports:
          - "8088:8088"
        volumes:
          - "{{ app_dir }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"

    - name: Reload Nginx if config changed
      community.docker.docker_container_exec:
        container: nginx
        command: nginx -s reload
      when: nginx_config.changed

    - name: Run nginx-prometheus-exporter
      community.docker.docker_container:
        name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.1.0
        state: started
        restart_policy: always
        networks:
          - name: audit-net
        ports:
          - "9113:9113"
        command:
          - -nginx.scrape-uri=http://nginx:8088/stub_status
